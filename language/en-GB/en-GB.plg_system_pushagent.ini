PLG_SYSTEM_PUSHAGENT="System - Push Agent"
PLG_SYSTEM_PUSHAGENT_XML_DESCRIPTION="<strong>Push Agent</strong> - web push notifications for your Joomla site.<br>1. Sign in at <a href=\"https://app.pushagent.net\" target=\"_blank\" rel=\"noopener\">app.pushagent.net</a> and add your website.<br>2. Open <em>Integration</em> and copy your <strong>access token</strong>.<br>3. Paste it into this plugin and click Save."
PLG_SYSTEM_PUSHAGENT_TOKEN_LABEL="Access token"
PLG_SYSTEM_PUSHAGENT_TOKEN_DESC="Copy it from your Push Agent dashboard (app.pushagent.net &rarr; Integration &rarr; Access token)."
PLG_SYSTEM_PUSHAGENT_DELAY_LABEL="Ask visitors after (seconds)"
PLG_SYSTEM_PUSHAGENT_DELAY_DESC="How many seconds after a page loads the &quot;Allow notifications&quot; card appears for new visitors."
PLG_SYSTEM_PUSHAGENT_APPURL_LABEL="Push Agent address"
PLG_SYSTEM_PUSHAGENT_APPURL_DESC="Leave as https://app.pushagent.net/ unless Push Agent support tells you otherwise."
PLG_SYSTEM_PUSHAGENT_CREATESW_LABEL="Create pushagent-sw.js automatically"
PLG_SYSTEM_PUSHAGENT_CREATESW_DESC="The plugin creates the small service worker file in your site's root folder. Choose No only if you upload pushagent-sw.js yourself."
PLG_SYSTEM_PUSHAGENT_MSG_NO_TOKEN="Push Agent: paste your access token to start collecting subscribers. You find it in your Push Agent dashboard under Integration."
PLG_SYSTEM_PUSHAGENT_MSG_SW_OK="Push Agent is set up. The service worker file pushagent-sw.js is in your site's root folder."
PLG_SYSTEM_PUSHAGENT_MSG_SW_FAIL="Push Agent could not create pushagent-sw.js in %s (the folder is not writable). Download pushagent-sw.js from your Push Agent dashboard (Integration page) and upload it to that folder."
